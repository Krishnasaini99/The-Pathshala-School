<main>
  <section class="section">
    <div class="wrap">
      <h2>👩‍🏫 Our Teachers</h2>
      <p class="center muted">Full-time faculty, anubhavi aur caring — same teacher day one se final exam tak.</p>
      <div class="grid3">
        <div class="card prog" *ngFor="let s of store.db.staff; let i = index">
          <img class="prog-img" loading="lazy" [alt]="s.name" [src]="tPhoto(i)" />
          <h3>{{ s.name }}</h3>
          <p class="muted">{{ s.role }} — {{ s.sub }}</p>
          <p>{{ tBio(i) }}</p>
        </div>
      </div>
      <p class="center" style="margin-top:18px"><button class="btn ghost" routerLink="/">← Back to Home</button></p>
    </div>
  </section>
  <footer><div class="wrap foot"><b>The PathShala School</b> © 2026. All rights reserved. • Faculty 👩‍🏫</div></footer>
</main>
